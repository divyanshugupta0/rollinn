<!-- Admin Credentials and Subscription Plan Modals -->

<!-- Admin Credentials Modal -->
<div class="modal fade" id="adminCredentialsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Admin Credentials</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="adminUsername" class="form-label">Admin Username</label>
                    <input type="text" class="form-control" id="adminUsername" required>
                </div>
                <div class="mb-3">
                    <label for="adminPassword" class="form-label">Admin Password</label>
                    <input type="password" class="form-control" id="adminPassword" required>
                </div>
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Admin Email</label>
                    <input type="email" class="form-control" id="adminEmail" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="showSubscriptionModal()">Next</button>
            </div>
        </div>
    </div>
</div>

<!-- Subscription Plan Modal -->
<div class="modal fade" id="subscriptionPlanModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Choose Subscription Plan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">Spark Plan</h5>
                                <p class="card-text">1 Month Subscription</p>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subscriptionPlan" id="sparkPlan" value="spark" checked>
                                    <label class="form-check-label" for="sparkPlan">
                                        Select Plan
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">Bullet Plan</h5>
                                <p class="card-text">2 Month Subscription</p>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="subscriptionPlan" id="bulletPlan" value="bullet">
                                    <label class="form-check-label" for="bulletPlan">
                                        Select Plan
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="alert alert-info">
                    <small><i class="fas fa-info-circle me-1"></i> Subscription will start from today and will be valid until the plan expires.</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="backToAdminCredentials()">Back</button>
                <button type="button" class="btn btn-success" onclick="completeRegistration()">Complete Registration</button>
            </div>
        </div>
    </div>
</div>
