<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 50px auto;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #4a69bd;
            color: white;
            border-radius: 10px 10px 0 0 !important;
            padding: 15px 20px;
        }
        .btn-primary {
            background-color: #4a69bd;
            border-color: #4a69bd;
        }
        .btn-primary:hover {
            background-color: #1e3799;
            border-color: #1e3799;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-school me-2"></i>Attendance Portal</h3>
                    </div>
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h4>Welcome to the Attendance Portal</h4>
                            <p class="text-muted">Please select your role to continue</p>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="card h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-user-tie fa-3x mb-3 text-primary"></i>
                                        <h5>Owner</h5>
                                        <p class="small text-muted">Manage schools and subscriptions</p>
                                        <a href="owner.html" class="btn btn-primary btn-sm">Login as Owner</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-user-shield fa-3x mb-3 text-success"></i>
                                        <h5>Admin</h5>
                                        <p class="small text-muted">Manage school operations</p>
                                        <a href="admin.html" class="btn btn-success btn-sm">Login as Admin</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-chalkboard-teacher fa-3x mb-3 text-info"></i>
                                        <h5>Teacher</h5>
                                        <p class="small text-muted">Take attendance and view reports</p>
                                        <a href="teacher.html" class="btn btn-info btn-sm">Login as Teacher</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-center">
                            <p class="small text-muted">Don't have an account? <a href="registration-steps.html">Register a new school</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Firebase Config -->
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD_An-qb0XTLpaLdrOftAEOqsshGpPbv1w",
            authDomain: "firefly-64eef.firebaseapp.com",
            databaseURL: "https://firefly-64eef-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "firefly-64eef",
            storageBucket: "firefly-64eef.firebasestorage.app",
            messagingSenderId: "563239732954",
            appId: "1:563239732954:web:1774bfd1f7aceedeb707e3",
            measurementId: "G-RKL3BV2H03"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Set persistence to LOCAL immediately
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch(error => {
                console.error("Persistence error:", error);
            });
    </script>
    
    <!-- Auth Helper Scripts -->
    <script src="auth-fix.js"></script>
    <script src="login-redirect.js"></script>
</body>
</html>
