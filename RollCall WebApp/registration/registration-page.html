<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration - Attendance Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #4a69bd;
            color: white;
            border-radius: 10px 10px 0 0 !important;
            padding: 15px 20px;
        }
        .btn-primary {
            background-color: #4a69bd;
            border-color: #4a69bd;
        }
        .btn-primary:hover {
            background-color: #1e3799;
            border-color: #1e3799;
        }
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            max-width: 350px;
        }
    </style>
</head>
<body>
    <!-- Alert Container -->
    <div class="alert-container" id="alertContainer"></div>
    
    <div class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0"><i class="fas fa-school me-2"></i>School Registration</h3>
                <a href="index.html" class="btn btn-sm btn-light"><i class="fas fa-home me-1"></i>Home</a>
            </div>
            <div class="card-body p-4">
                <!-- Registration Steps Form -->
                <div id="registrationForm">
                    <!-- Registration Steps will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase App -->
<script src="https://rollcall-worker.divyanshugupta415.workers.dev/firebase-config"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- Firebase Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase Config -->
    <script type="module">
        import firebaseConfig from '../auth/firebase-config.js';
        
        // Initialize Firebase for owner
        const ownerAuth = firebase.initializeApp(firebaseConfig);
        
        // Make it available globally
        window.ownerAuth = ownerAuth;
        
        // Initialize variables
        let currentUser = null;
        let firebaseApp = null;
        let database = null;
        let isFirebaseConnected = false;
        
        // Listen for auth state changes
        ownerAuth.auth().onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user;
                console.log("User signed in:", user.email);
                
                // Connect to default Firebase
                connectToFirebase();
            } else {
                currentUser = null;
                console.log("No user signed in");
                
                // Try to connect to default Firebase anyway for registration
                connectToFirebase();
            }
        });
        
        // Connect to Firebase function
        function connectToFirebase() {
            try {
                // Reuse the authenticated app so reads and writes target the same shared project.
                firebaseApp = ownerAuth;
                database = firebaseApp.database();
                isFirebaseConnected = true;
                
                console.log("Firebase connected successfully");
                
                // Make these available globally
                window.database = database;
                window.isFirebaseConnected = isFirebaseConnected;
                
                // Load registration steps
                loadRegistrationSteps();
                
            } catch (error) {
                console.error('Firebase initialization error:', error);
                showAlert('Failed to connect to Firebase: ' + error.message, 'danger');
            }
        }
        
        // Function to load registration steps
        function loadRegistrationSteps() {
            fetch('registration-steps.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('registrationForm').innerHTML = html;
                    
                    // Load registration steps script
                    const script = document.createElement('script');
                    script.src = 'registration-steps.js';
                    document.body.appendChild(script);
                })
                .catch(error => {
                    console.error('Error loading registration steps:', error);
                    showAlert('Error loading registration form', 'danger');
                });
        }
        
        // Show alert function
        window.showAlert = function(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            const alertHTML = `
                <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            alertContainer.insertAdjacentHTML('beforeend', alertHTML);
            
            // Auto dismiss after 5 seconds
            setTimeout(() => {
                const alertElement = document.getElementById(alertId);
                if (alertElement) {
                    const bsAlert = new bootstrap.Alert(alertElement);
                    bsAlert.close();
                }
            }, 5000);
        };
        
        // Add recent activity function (stub for compatibility)
        window.addRecentActivity = function(activity) {
            console.log("Activity:", activity);
        };
    </script>
</body>
</html>
