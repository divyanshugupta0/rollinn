<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Verification - RollCall</title>
<script src="../auth/firebase-config.runtime.js"></script>
        <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
        }
        
        .status.loading {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .status.error {
            background: #fef2f2;
            color: #991b1b;
        }
        
        .btn {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .location-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            color: #475569;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .icon.location { color: #3b82f6; }
        .icon.success { color: #10b981; }
        .icon.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">RollCall</div>
        <div class="subtitle">Location Verification</div>
        
        <div id="content">
            <div class="icon location">📍</div>
            <h2>Share Your Location</h2>
            <p>We need to verify your location for attendance purposes. This will capture your current GPS coordinates.</p>
            
            <button id="shareLocationBtn" class="btn">
                Share My Location
            </button>
            
            <div class="location-info">
                <strong>Privacy Notice:</strong> Your location will only be used for attendance verification and will be securely stored.
            </div>
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = window.ROLLCALL_FIREBASE_CONFIG;
        
        firebase.initializeApp(firebaseConfig);
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');
        
        const shareLocationBtn = document.getElementById('shareLocationBtn');
        const statusDiv = document.getElementById('status');
        const contentDiv = document.getElementById('content');
        
        // Check if token is valid
        if (!token || !email) {
            showError('Invalid or expired link. Please request a new location verification link.');
            return;
        }
        
        // Verify token exists in database
        firebase.database().ref('locationRequests/' + token).once('value')
            .then((snapshot) => {
                if (!snapshot.exists()) {
                    showError('This link has expired or is invalid. Please request a new one.');
                    return;
                }
                
                const request = snapshot.val();
                if (request.status === 'completed') {
                    showSuccess('Location already verified for this request.');
                    return;
                }
                
                if (Date.now() > request.expiresAt) {
                    showError('This link has expired. Please request a new one.');
                    return;
                }
            })
            .catch((error) => {
                console.error('Error verifying token:', error);
                showError('Unable to verify link. Please try again.');
            });
        
        shareLocationBtn.addEventListener('click', shareLocation);
        
        function shareLocation() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by this browser.');
                return;
            }
            
            showLoading('Getting your location...');
            shareLocationBtn.disabled = true;
            
            const options = {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            };
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const location = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: Date.now(),
                        userAgent: navigator.userAgent,
                        deviceType: /Mobile|Android|iPhone|iPad/.test(navigator.userAgent) ? 'mobile' : 'desktop'
                    };
                    
                    // Update the location request in Firebase
                    firebase.database().ref('locationRequests/' + token).update({
                        location: location,
                        status: 'completed',
                        completedAt: Date.now()
                    })
                    .then(() => {
                        showSuccess('Location verified successfully! You can now close this page.');
                        contentDiv.innerHTML = `
                            <div class="icon success">✅</div>
                            <h2>Location Verified!</h2>
                            <p>Your location has been successfully captured and verified.</p>
                            <div class="location-info">
                                <strong>Coordinates:</strong><br>
                                Latitude: ${location.latitude.toFixed(6)}<br>
                                Longitude: ${location.longitude.toFixed(6)}<br>
                                Accuracy: ±${Math.round(location.accuracy)}m
                            </div>
                        `;
                    })
                    .catch((error) => {
                        console.error('Error saving location:', error);
                        showError('Failed to save location. Please try again.');
                        shareLocationBtn.disabled = false;
                    });
                },
                (error) => {
                    let errorMessage = 'Unable to get your location. ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage += 'Please allow location access and try again.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage += 'Location information is unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage += 'Location request timed out. Please try again.';
                            break;
                        default:
                            errorMessage += 'An unknown error occurred.';
                            break;
                    }
                    showError(errorMessage);
                    shareLocationBtn.disabled = false;
                },
                options
            );
        }
        
        function showLoading(message) {
            statusDiv.innerHTML = `
                <div class="spinner"></div>
                ${message}
            `;
            statusDiv.className = 'status loading';
            statusDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            statusDiv.innerHTML = message;
            statusDiv.className = 'status success';
            statusDiv.style.display = 'block';
        }
        
        function showError(message) {
            statusDiv.innerHTML = message;
            statusDiv.className = 'status error';
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
