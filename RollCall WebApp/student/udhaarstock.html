<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Udhaar & Stock Management with Firebase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        header { background: #007BFF; color: #fff; padding: 1.5em 2em; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { background: #0056b3; color: #fff; padding: 1em 2em; display: flex; justify-content: center; gap: 2em; }
        nav a { color: #fff; text-decoration: none; font-weight: 600; font-size: 1.1em; transition: color 0.3s ease; }
        nav a:hover { color: #ffc107; }
        main { max-width: 1000px; margin: 2em auto; padding: 0 1em; }
        h2 { color: #007BFF; border-bottom: 2px solid #007BFF; padding-bottom: 0.3em; margin-bottom: 1em; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2em; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 0.75em 1em; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #e9f0ff; font-weight: 700; }
        tr:hover { background: #f1f9ff; }
        form { background: #fff; padding: 1em 1.5em; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2em; display: flex; flex-wrap: wrap; gap: 1em; align-items: center; }
        label { flex: 1 1 200px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        button { background: #007BFF; color: #fff; border: none; padding: 0.7em 1.5em; font-size: 1em; border-radius: 4px; cursor: pointer; transition: background 0.3s ease; }
        button:hover { background: #0056b3; }
        .totals { font-weight: 700; margin-bottom: 1em; }
        .search-box { margin-bottom: 1em; }
        .clear-btn { background: #dc3545; margin-left: auto; }
        @media (max-width: 700px) {
            main { margin: 1em; padding: 0; }
            form { flex-direction: column; }
            label { flex: 1 1 100%; }
        }
    </style>
    <!-- Firebase App (the core Firebase SDK) -->
<script src="../auth/firebase-config.runtime.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <header>
        <h1>Professional Udhaar & Stock Management with Firebase</h1>
    </header>
    <nav>
        <a href="#udhaar">Udhaar Ledger</a>
        <a href="#stock">Stock Management</a>
    </nav>
    <main>
        <!-- Udhaar Section -->
        <section id="udhaar">
            <h2>Udhaar Ledger</h2>
            <form id="udhaarForm">
                <label>Customer Name: <input type="text" id="customerName" required></label>
                <label>Amount (₹): <input type="number" id="udhaarAmount" required></label>
                <label>Note: <input type="text" id="udhaarNote"></label>
                <button type="submit">Add Udhaar</button>
                <button type="button" id="clearUdhaar" class="clear-btn">Clear All Udhaar</button>
            </form>
            <input type="text" id="udhaarSearch" class="search-box" placeholder="Search Udhaar...">
            <div class="totals">Total Udhaar Amount: ₹<span id="totalUdhaar">0</span></div>
            <table id="udhaarTable">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Amount (₹)</th>
                        <th>Note</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Entries will appear here -->
                </tbody>
            </table>
        </section>

        <!-- Stock Section -->
        <section id="stock">
            <h2>Stock Management</h2>
            <form id="stockForm">
                <label>Item Name: <input type="text" id="itemName" required></label>
                <label>Quantity: <input type="number" id="itemQty" required></label>
                <label>Unit Price (₹): <input type="number" id="itemPrice" required></label>
                <button type="submit">Add Stock</button>
                <button type="button" id="clearStock" class="clear-btn">Clear All Stock</button>
            </form>
            <input type="text" id="stockSearch" class="search-box" placeholder="Search Stock...">
            <div class="totals">Total Stock Value: ₹<span id="totalStockValue">0</span></div>
            <table id="stockTable">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Unit Price (₹)</th>
                        <th>Date Added</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Stock entries will appear here -->
                </tbody>
            </table>
        </section>
    </main>
    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = window.ROLLCALL_FIREBASE_CONFIG;

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Udhaar functionality
        const udhaarForm = document.getElementById('udhaarForm');
        const udhaarTableBody = document.getElementById('udhaarTable').getElementsByTagName('tbody')[0];
        const totalUdhaarSpan = document.getElementById('totalUdhaar');
        const udhaarSearch = document.getElementById('udhaarSearch');
        const clearUdhaarBtn = document.getElementById('clearUdhaar');
        let udhaarData = [];

        function renderUdhaar() {
            udhaarTableBody.innerHTML = '';
            let total = 0;
            udhaarData.forEach(entry => {
                const row = udhaarTableBody.insertRow();
                row.insertCell(0).textContent = entry.name;
                row.insertCell(1).textContent = entry.amount;
                row.insertCell(2).textContent = entry.note;
                row.insertCell(3).textContent = entry.date;
                total += parseFloat(entry.amount);
            });
            totalUdhaarSpan.textContent = total.toFixed(2);
        }

        function fetchUdhaar() {
            database.ref('udhaar').on('value', snapshot => {
                udhaarData = [];
                snapshot.forEach(childSnapshot => {
                    udhaarData.push(childSnapshot.val());
                });
                renderUdhaar();
            });
        }

        udhaarForm.onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('customerName').value.trim();
            const amount = parseFloat(document.getElementById('udhaarAmount').value);
            const note = document.getElementById('udhaarNote').value.trim();
            const date = new Date().toLocaleDateString();
            if(name && !isNaN(amount)) {
                const newEntry = { name, amount, note, date };
                const newKey = database.ref().child('udhaar').push().key;
                let updates = {};
                updates['/udhaar/' + newKey] = newEntry;
                database.ref().update(updates);
                this.reset();
            }
        };

        udhaarSearch.oninput = function() {
            const filter = this.value.toLowerCase();
            const rows = udhaarTableBody.getElementsByTagName('tr');
            Array.from(rows).forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        };

        clearUdhaarBtn.onclick = function() {
            if(confirm('Are you sure you want to clear all Udhaar entries?')) {
                database.ref('udhaar').remove();
            }
        };

        fetchUdhaar();

        // Stock functionality
        const stockForm = document.getElementById('stockForm');
        const stockTableBody = document.getElementById('stockTable').getElementsByTagName('tbody')[0];
        const totalStockValueSpan = document.getElementById('totalStockValue');
        const stockSearch = document.getElementById('stockSearch');
        const clearStockBtn = document.getElementById('clearStock');
        let stockData = [];

        function renderStock() {
            stockTableBody.innerHTML = '';
            let totalValue = 0;
            stockData.forEach(item => {
                const row = stockTableBody.insertRow();
                row.insertCell(0).textContent = item.name;
                row.insertCell(1).textContent = item.qty;
                row.insertCell(2).textContent = item.price;
                row.insertCell(3).textContent = item.date;
                totalValue += item.qty * item.price;
            });
            totalStockValueSpan.textContent = totalValue.toFixed(2);
        }

        function fetchStock() {
            database.ref('stock').on('value', snapshot => {
                stockData = [];
                snapshot.forEach(childSnapshot => {
                    stockData.push(childSnapshot.val());
                });
                renderStock();
            });
        }

        stockForm.onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const qty = parseFloat(document.getElementById('itemQty').value);
            const price = parseFloat(document.getElementById('itemPrice').value);
            const date = new Date().toLocaleDateString();
            if(name && !isNaN(qty) && !isNaN(price)) {
                const newItem = { name, qty, price, date };
                const newKey = database.ref().child('stock').push().key;
                let updates = {};
                updates['/stock/' + newKey] = newItem;
                database.ref().update(updates);
                this.reset();
            }
        };

        stockSearch.oninput = function() {
            const filter = this.value.toLowerCase();
            const rows = stockTableBody.getElementsByTagName('tr');
            Array.from(rows).forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        };

        clearStockBtn.onclick = function() {
            if(confirm('Are you sure you want to clear all Stock entries?')) {
                database.ref('stock').remove();
            }
        };

        fetchStock();
    </script>
</body>
</html>
